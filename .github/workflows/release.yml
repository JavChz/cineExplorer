name: Release Build & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Determine Version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.tag }}" -ne "") {
            $ver = "${{ github.event.inputs.tag }}"
          } elseif ($env:GITHUB_REF_NAME -match '^v?(.+)$') {
            $ver = "v$($Matches[1])"
          } else {
            $toml = Get-Content "Cargo.toml" -Raw
            if ($toml -match '(?m)^version\s*=\s*"([^"]+)"') {
              $ver = "v$($Matches[1])"
            } else {
              $ver = "v0.1.0"
            }
          }
          Write-Host "Resolved Version: $ver"
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows Zip Archive
        shell: pwsh
        run: |
          $ver = $env:RELEASE_VERSION
          $pkgName = "cine-explorer-$ver-windows-x64"
          $staging = "staging\$pkgName"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\cine-explorer.exe" -Destination "$staging\cine-explorer.exe"
          Copy-Item "README.md" -Destination "$staging\README.md"
          Copy-Item "LICENSE" -Destination "$staging\LICENSE"
          Copy-Item "THIRD_PARTY_LICENSES.md" -Destination "$staging\THIRD_PARTY_LICENSES.md"

          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "$staging\*" -DestinationPath "dist\$pkgName.zip" -CompressionLevel Optimal

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: dist/*.zip

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Determine Version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VER="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF_NAME" =~ ^v?(.+)$ ]]; then
            VER="v${BASH_REMATCH[1]}"
          else
            VER=$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f 2)
            VER="v$VER"
          fi
          echo "RELEASE_VERSION=$VER" >> $GITHUB_ENV

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Linux tar.gz
        run: |
          VER="${{ env.RELEASE_VERSION }}"
          PKG_NAME="cine-explorer-${VER}-linux-x64"
          STAGING="staging/${PKG_NAME}"
          mkdir -p "$STAGING"
          cp "target/x86_64-unknown-linux-gnu/release/cine-explorer" "$STAGING/cine-explorer"
          chmod +x "$STAGING/cine-explorer"
          cp README.md "$STAGING/"
          cp LICENSE "$STAGING/"
          cp THIRD_PARTY_LICENSES.md "$STAGING/"

          mkdir -p dist
          tar -czf "dist/${PKG_NAME}.tar.gz" -C staging "$PKG_NAME"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: dist/*.tar.gz

  build-macos:
    name: Build macOS (Universal / Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Determine Version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VER="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF_NAME" =~ ^v?(.+)$ ]]; then
            VER="v${BASH_REMATCH[1]}"
          else
            VER=$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f 2)
            VER="v$VER"
          fi
          echo "RELEASE_VERSION=$VER" >> $GITHUB_ENV

      - name: Build Release Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package macOS tar.gz
        run: |
          VER="${{ env.RELEASE_VERSION }}"
          PKG_NAME="cine-explorer-${VER}-macos-arm64"
          STAGING="staging/${PKG_NAME}"
          mkdir -p "$STAGING"
          cp "target/aarch64-apple-darwin/release/cine-explorer" "$STAGING/cine-explorer"
          chmod +x "$STAGING/cine-explorer"
          cp README.md "$STAGING/"
          cp LICENSE "$STAGING/"
          cp THIRD_PARTY_LICENSES.md "$STAGING/"

          mkdir -p dist
          tar -czf "dist/${PKG_NAME}.tar.gz" -C staging "$PKG_NAME"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: dist/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten release artifacts
        run: |
          mkdir -p final-dist
          find release-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} final-dist/ \;
          ls -la final-dist/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "cineExplorer ${{ steps.tag_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: final-dist/*
